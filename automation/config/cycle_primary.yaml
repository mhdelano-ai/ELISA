# Primary design, ONE-STEP mode: per-cycle step table of docs/05 section 4.1 (installed system).
# Times are CYCLE minutes: t = 0 is the start of the SM-FL sample aspiration (Empower line L1); the SM-FL
# Inject Start contact closure is expected at t = 1.0 (docs/05 s4.1 "1 -> 3 Inject Start t0").
# Python owns V2/V3/V4, the SIA module, the magnet and the Gamry; Empower owns the BSM programme and the SM-FL.
# 'empower' fields are documentation of what the Empower instrument method must do at that time (Python does not
# command the BSM); they are checked only for consistency.
#
# Deviation from docs/05 (stated): the 3.5 min cleaning step 52.6 -> 56.1 is split into a 0.5 min post-readout
# baseline (trap sealed, cell in detect, fresh substrate through the shunt) and 3.0 min cleaning, so that the charge
# can be baseline-corrected "with baseline windows before and after" (docs/05 s4.1). 3.0 min lies inside the model
# range of ma.timing.bead_flush_and_clean (2-6 min). Total cycle unchanged: 56.1 min.
#
# Revised after the final review (docs/08 s10): beads and conjugate dosed from SEPARATE reservoirs on their own SIA
# ports (B4); A1 = Tris-buffered saline + Tween, no phosphate (B1); BSM flow declared in every step (`bsm`) and the
# trap flow at the tee checked (S2: SIA 99 + BSM 1 uL/min = 100); the SM-FL action declared per step (`smfl`) and the
# cleaning step uses a needle wash, not a second injection (S3); accumulation shunt at the readout flow (W5).
# 'empower' text = what the Empower method must do; 'bsm' and 'smfl' = the same, structured, checked by cycle.validate.
name: primary_one_step
mode: one_step
source: "docs/05_design_decision.md section 4.1 (per-cycle step table)"
time_limit_min: 60
injects:
  - {name: sample, at_min: 1.0, line_code: 1}
constraints:
  max_trap_loading_flow_uL_min: 100   # docs/05 s1.1: trap efficiency 0.9 assumed only up to the baseline flow
watchdog:
  inject_tolerance_s: 30          # docs/02 s3.2 point 6: Inject Start late by > 30 s -> safe state
  first_inject_max_wait_s: 3600   # the first sample of a sample set may wait for Empower start-up
  step_overrun_warn_s: 2
safe_state:                       # docs/05 s4.1: "A watchdog parks V2 = isolate and V3 = bypass on any fault"
  valves: {V2: isolate, V3: bypass, V4: B}
  magnet: "on"                    # keeps beads in the trap rather than sending them downstream
  sia: stop
  potentiostat: cell_off
potentiostat:
  channels:
    1: {role: generator, potential_V: 0.35}     # HQ -> BQ, vs Ag/AgCl (docs/05 s4.1)
    # Channel 2 (IDA collector, -0.1 to -0.2 V UNVERIFIED) only if the optional flow IDA is fitted (docs/08 S9: the
    # Stage-3 default is a commercial single-channel thin-layer cell). Uncomment for the IDA:
    # 2: {role: collector, potential_V: -0.15}
  sample_period_s: 0.1
signal:                            # windows in cycle minutes (see automation/elisa_auto/signal_proc.py)
  pre_baseline: [51.1, 51.6]
  readout: [51.6, 52.6]
  post_baseline: [52.6, 53.1]
steps:
  - {name: dose_beads, start_min: -1.0, end_min: -0.6,
     sia: {action: dispense, from: beads, to: cup, volume_uL: 10},
     note: "10 uL bead suspension (5e5 beads) from the bead-only reservoir (stirred, 4-8 C)"}
  - {name: flush_sia_channel, start_min: -0.6, end_min: -0.4,
     sia: {action: flush_channel, from: wash, to: waste, volume_uL: 50},
     note: "clears beads from the common SIA channel before the conjugate is aspirated"}
  - {name: dose_conjugate, start_min: -0.4, end_min: 0.0,
     sia: {action: dispense, from: conjugate, to: cup, volume_uL: 10},
     note: "10 uL of 6.6 nM ALP conjugate from the separate conjugate reservoir (4-8 C) -> 0.3 nM in ~220 uL"}
  - {name: aspirate_sample, start_min: 0.0, end_min: 1.0, smfl: aspirate,
     valves: {V4: A, V2: isolate, V3: bypass}, bsm: {flow_uL_min: 100, solvent: A1},
     empower: "SM-FL full-loop aspiration (2x overfill, ~200 uL drawn); BSM 100 uL/min A1 (TBS + Tween, no phosphate)"}
  - {name: transfer_sample_to_cup, start_min: 1.0, end_min: 3.0, smfl: inject,
     valves: {V4: A, V2: isolate, V3: bypass}, bsm: {flow_uL_min: 100, solvent: A1},
     empower: "Inject Start t0; 2 loop volumes (200 uL) push the sample into the cup; BSM 100 uL/min A1"}
  - {name: incubation, start_min: 3.0, end_min: 33.0, role: incubation, smfl: idle,
     valves: {V4: B, V2: isolate, V3: bypass}, bsm: {flow_uL_min: 100, solvent: A1},
     sia: {action: mix, port: cup, volume_uL: 50, every_min: 2.0},
     empower: "BSM 100 uL/min A1 to waste via the shunt (no overlap with one cup, docs/08 W10)"}
  - {name: load_trap, start_min: 33.0, end_min: 39.6, magnet: "on", smfl: idle,
     valves: {V4: B, V2: perfuse, V3: bypass}, bsm: {flow_uL_min: 1, solvent: A1},
     sia: {action: empty_cup_through_trap, from: cup, to: to_trap, volume_uL: 653, flow_uL_min: 99},
     empower: "BSM at its minimum, 1 uL/min A1, for 33.0-39.6 min (joins the SIA line at the tee); log pressure",
     note: "cup contents plus 2 rinses through the trap; trap flow = 99 + 1 = 100 uL/min (docs/08 S2)"}
  - {name: wash, start_min: 39.6, end_min: 40.6, smfl: idle, valves: {V4: B, V2: perfuse, V3: bypass},
     bsm: {flow_uL_min: 100, solvent: A1}, empower: "BSM 100 uL/min A1"}
  - {name: substrate_fill, start_min: 40.6, end_min: 41.6, smfl: idle, valves: {V4: B, V2: perfuse, V3: bypass},
     bsm: {flow_uL_min: 200, solvent: B1}, potentiostat: start_acquisition,
     empower: "A1 -> B1 step, 200 uL/min B1 (HQDP substrate); completeness of the switch checked in E2.1 (W4)"}
  - {name: accumulation, start_min: 41.6, end_min: 51.6, role: accumulation, smfl: idle,
     valves: {V4: B, V2: isolate, V3: detect}, bsm: {flow_uL_min: 10, solvent: B1}, potentiostat: mark,
     empower: "10 uL/min B1 via shunt and cell (= readout flow, docs/08 W5); substrate blank current recorded"}
  - {name: readout, start_min: 51.6, end_min: 52.6, role: readout, smfl: idle,
     valves: {V4: B, V2: perfuse, V3: detect}, bsm: {flow_uL_min: 10, solvent: B1}, potentiostat: mark,
     empower: "10 uL/min B1: sweep the trap contents through the cell"}
  - {name: post_baseline, start_min: 52.6, end_min: 53.1, role: post_baseline, smfl: idle,
     valves: {V4: B, V2: isolate, V3: detect}, bsm: {flow_uL_min: 10, solvent: B1}, potentiostat: mark,
     empower: "B1 through shunt and cell (fresh substrate baseline)"}
  - {name: clean, start_min: 53.1, end_min: 56.1, magnet: "off", smfl: needle_wash,
     valves: {V4: B, V2: perfuse, V3: bypass}, bsm: {flow_uL_min: 300, solvent: A1}, potentiostat: stop_acquisition,
     sia: {action: rinse_cup, port: cup, repeats: 3},
     empower: "beads to waste at 300 uL/min A1 through the loop (in line since the injection) and the trap; SM-FL needle wash, NO injection (docs/08 S3)"}
