# In-platform fallback, SEQUENTIAL mode on the same hardware (docs/05 s4.1 "Sequential mode" and s4.0 route S):
# beads only into the cup; after the trap wash an SM-FL injection of 3 nM ALP conjugate (20 uL) is stopped on the
# trapped beads for 3 min, then a 2 min wash; accumulation 5 min. Time to result 58.1 min (docs/05).
# The conjugate injection is a second Empower line (L2) -> a second Inject Start with its own line code
# (docs/02 s3.2 point 2). The step times below are this task's breakdown of docs/05's totals.
# Same post-baseline deviation as cycle_primary.yaml (cleaning 3.5 -> 3.0 min + 0.5 min post-baseline).
name: fallback_sequential
mode: sequential
source: "docs/05_design_decision.md section 4.1 (sequential mode) / section 4.0 route S"
time_limit_min: 60
injects:
  - {name: sample, at_min: 1.0, line_code: 1}
  - {name: conjugate, at_min: 41.6, line_code: 2}
watchdog:
  inject_tolerance_s: 30
  first_inject_max_wait_s: 3600
  step_overrun_warn_s: 2
safe_state:
  valves: {V2: isolate, V3: bypass, V4: B}
  magnet: "on"
  sia: stop
  potentiostat: cell_off
potentiostat:
  channels:
    1: {role: generator, potential_V: 0.35}
    2: {role: collector, potential_V: -0.15}   # UNVERIFIED
  sample_period_s: 0.1
signal:
  pre_baseline: [53.1, 53.6]
  readout: [53.6, 54.6]
  post_baseline: [54.6, 55.1]
steps:
  - {name: dose_beads, start_min: -1.0, end_min: 0.0,
     sia: {action: dispense, from: reservoir, to: cup, volume_uL: 20}, note: "beads only (no conjugate)"}
  - {name: aspirate_sample, start_min: 0.0, end_min: 1.0, valves: {V4: A, V2: isolate, V3: bypass},
     empower: "L1: SM-FL full-loop aspiration"}
  - {name: transfer_sample_to_cup, start_min: 1.0, end_min: 3.0, valves: {V4: A, V2: isolate, V3: bypass},
     empower: "L1 Inject Start t0; 200 uL into the cup"}
  - {name: incubation, start_min: 3.0, end_min: 33.0, role: incubation, valves: {V4: B, V2: isolate, V3: bypass},
     sia: {action: mix, port: cup, volume_uL: 50, every_min: 2.0}}
  - {name: load_trap, start_min: 33.0, end_min: 39.6, magnet: "on", valves: {V2: perfuse, V3: bypass},
     sia: {action: empty_cup_through_trap, volume_uL: 660, flow_uL_min: 100}}
  - {name: wash, start_min: 39.6, end_min: 40.6, valves: {V4: B, V2: perfuse, V3: bypass}}
  - {name: aspirate_conjugate, start_min: 40.6, end_min: 41.6, valves: {V4: B, V2: perfuse, V3: bypass},
     empower: "L2: SM-FL aspirates 20 uL of 3 nM ALP conjugate from the shared 4-8 C vial"}
  - {name: conjugate_fill, start_min: 41.6, end_min: 42.6, valves: {V4: B, V2: perfuse, V3: bypass},
     empower: "L2 Inject Start; conjugate plug onto the trapped beads"}
  - {name: conjugate_stop, start_min: 42.6, end_min: 45.6, role: label_incubation,
     valves: {V4: B, V2: isolate, V3: bypass}, note: "3 min stopped-flow labelling; loop flushed to waste via shunt"}
  - {name: wash_after_conjugate, start_min: 45.6, end_min: 47.6, valves: {V4: B, V2: perfuse, V3: bypass}}
  - {name: substrate_fill, start_min: 47.6, end_min: 48.6, valves: {V4: B, V2: perfuse, V3: bypass},
     potentiostat: start_acquisition}
  - {name: accumulation, start_min: 48.6, end_min: 53.6, role: accumulation,
     valves: {V4: B, V2: isolate, V3: detect}, potentiostat: mark}
  - {name: readout, start_min: 53.6, end_min: 54.6, role: readout,
     valves: {V4: B, V2: perfuse, V3: detect}, potentiostat: mark}
  - {name: post_baseline, start_min: 54.6, end_min: 55.1, role: post_baseline,
     valves: {V4: B, V2: isolate, V3: detect}, potentiostat: mark}
  - {name: clean, start_min: 55.1, end_min: 58.1, magnet: "off", valves: {V4: B, V2: perfuse, V3: bypass},
     potentiostat: stop_acquisition, sia: {action: rinse_cup, repeats: 3}}
