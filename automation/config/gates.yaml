# Gate thresholds used by `python -m elisa_auto.analyze`. Each carries its source. "derived" = docs/06.
#
# G1 DECISION RULE (fixed 2026-11-11, before any Stage-1 data; final review docs/08 B3, docs/06 s4.11).
# P = max model P(success) over the admissible designs (P-chamb, S-chamb, B-bed) with ALL Stage-1 bench values
# entered by `python -m elisa_auto.model_feedback` (label factor with the coupled NSB factors pinned; thin-layer
# default cell; chamber S13 corrections). The unmeasured lever L4 never counts; at G1' its measured factors do.
# Must equal design_lib.G1_GO_MIN / G1_LEVER_MIN (tested). The per-quantity thresholds under G1 are FAST SCREENS.
G1_rule:
  p_go_min: 0.30          # GO: order Stage 2
  p_lever_min: 0.10       # GO-WITH-LEVER in [0.10, 0.30): order Stage 2 and run Stage 1C (L4) in parallel
                          # STOP below 0.10: no hardware purchase; Stage 1C in tubes, then G1' with measured L4
  applies_at: [G1a, G1]   # G1a (week 5): U1 + U3 (+ E1.3 reservoir-ageing arm) entered; G1 (week 7-8): all Stage-1
  source: "docs/08 B3 and s10; results/design/g1_decision_table.md"
G1:
  label_factor:        {confirm_max: 0.02, stop_min: 0.10, source: "screen from results/design/g1_decision_table.md (other values at priors; the rule is G1_rule). Was 0.04 / 0.15 (docs/05 s5 U1), superseded by docs/08 B3"}
  nsb_linearity_beta:  {confirm_max: 1.1, source: "derived (docs/06 E1.3): not super-linear"}
  wash_removed_frac:   {add_wash_min: 0.30, source: "docs/05 s5 U1 (S3a)"}
  free_hq_mol_per_mol: {confirm_max: 1.0e-5, kill_min: 1.0e-4, source: "docs/05 s5 U3"}
  hydrolysis_per_s:    {confirm_max: 1.0e-9, source: "docs/05 s5 U3"}
  detection_t_half_min: {one_step_min: 30, sequential_min: 10, lod_neutral_max: 45, source: "docs/08 S4 and results/design/mode_choice.md: modes cross at ~25 min; decided on the E1.5 on-bead t1/2 (BLI 1:1 k_off is ill-defined for the polyclonal pair). Was 60 min (docs/05 s5 U2)"}
  capture_t_half_min:  {min: 60, source: "docs/05 s5 U2"}
  kon_M_s:             {min: 3.0e+5, source: "docs/05 s4.1 / s5 U2"}
  detection_on_capture_ratio: {confirm_max: 1.2, reject_min: 3.0, source: "docs/05 s4.1"}
  blank_equivalent_pgml: {consistency_factor: 2.0, source: "consistency check only (docs/08 S7): E1.8 B within x2 of N_nsb(E1.3)/slope; no go/stop threshold"}
  ki_uM:               {confirm_min: 2.0, source: "docs/05 s5 U6"}
  smfl_recovery:       {confirm_min: 0.8, stop_max: 0.6, source: "derived (docs/06 E1.10)"}
  injector_carryover:  {confirm_max: 1.0e-4, source: "docs/08 S6; E1.10 with a 10 ng/mL challenge"}
G2:
  bead_dose_cv:        {confirm_max: 0.05, backup_min: 0.10, source: "docs/05 s5 U5"}
  trap_retention:      {confirm_min: 0.90, backup_max: 0.70, source: "docs/05 s5 U5"}
  wall_to_bead_ratio:  {confirm_max: 0.10, coat_min: 0.30, source: "docs/05 s5 U4"}
  lod_pgml:            {go_max: 1.5, stop_min: 3.0, source: "derived (docs/06 s5 G2)"}
  carryover:           {confirm_max: 1.0e-4, source: "docs/08 S6: 1e-4 for the analyte path (1e-3 after 1000 pg/mL would allow the LOD itself in the next sample); tested with a 10 ng/mL challenge. Was 1e-3 (docs/05 s5 U7)"}
G3:
  blank_cv:            {confirm_max: 0.10, l5_min: 0.15, source: "docs/05 s5 U7"}
  lod_pgml:            {confirm_max: 1.0, source: "docs/00 / docs/05 s5 U7"}
  carryover:           {confirm_max: 1.0e-4, source: "docs/08 S6 (10 ng/mL challenge, docs/06 s7.6); was 1e-3 (docs/05 s5 U7)"}
  time_to_result_min:  {max: 60, source: "docs/00"}
# INFORMATIONAL ONLY (added 2026-11-12, user decision): docs/06 E1.2b, HQDP pre-electrolysis ("guard cell") bench
# test. NOT a G1a/G1 input and not read by any code; the G1 rule and every gate above are unchanged. Its outcome
# decides at G1 whether a guard cell is considered at Stage 2 / kept in the cartridge design (docs/12) / dropped.
informational:
  E1_2b_pre_electrolysis:
    escape_fraction:     {pass_max: 0.01, drop_min: 0.10, source: "derived docs/06 E1.2b: 1e-5/1e-3 (S4a -> U3 acceptance; docs/12 1 % assumption, UNVERIFIED) and 1e-5/1e-4 (U3 kill line); pass on the upper 95 % bound, drop on the point estimate"}
    regrowth_k_h_per_s:  {pass_max: 1.0e-9, max_ratio_to_control: 2.0, source: "U3 hydrolysis acceptance (docs/05 s5 U3); ratio derived docs/06 E1.2b"}
    hq_like_product_nM:  {pass_max: 1.0, source: "derived docs/06 E1.2b: 1e-6 mol/mol in 1 mM HQDP"}
    alp_and_readout_ratio: {min: 0.85, max: 1.15, source: "derived docs/06 E1.2b (s12.2 resolution)"}
    hqdp_consumed_frac:  {pass_max: 0.01, source: "derived docs/06 E1.2b"}
  # INFORMATIONAL ONLY (added 2026-11-12, user decision; cartridge track): docs/06 M5a, read background of cartridge A's
  # three-window step read on a catalogue die (docs/13 s10.1, docs/16 s6.1). NOT a G1a/G1 input and not read by any
  # code; it decides A's read mode (step read vs R-flow) and whether A keeps the pre-electrolysis credit.
  M5a_read_background:
    sd_qnet_nC:          {pass_max: 0.05, source: "docs/13 s10.1 M5a-1 (drift-corrected Q_a - 2Q_b + Q_c, n >= 30 per die, >= 3 dies)"}
    curvature_residual_nC: {pass_max: 0.025, fraction_of_reads_min: 0.95, day_shift_max_nC: 0.05, source: "docs/13 s10.1 M5a-2 (d2 <= 0.27 pA/min^2)"}
    read_weight:         {target: 0.92, tolerance: 0.05, die_slope_cv_max: 0.05, source: "docs/13 s10.1 M5a-3"}
    escape_fraction:     {pass_max: 0.01, check_1mm_stub_min: 0.03, source: "docs/13 s10.1 M5a-4 (0.5 mm stubs; computed 0.2-0.5 %, docs/13 s3.6)"}
    e_rest_charge_frac:  {pass_max: 0.01, source: "docs/13 s10.1 M5a-5 (of Q_a)"}
    qre_drift_mV:        {per_8h_max: 20, between_windows_max: 2, source: "docs/13 s10.1 M5a-5"}
    rest_actuation_sd_ratio: {pass_max: 1.2, source: "docs/13 s10.1 M5a-6 (tidal strokes allowed in E_rest if met)"}
    leakage_ohm:         {min: 5.0e+12, contact_drift_ohm_max: 0.1, source: "docs/13 s10.1 M5a-7"}
