# Hardware / fluidics / control parameter database for the electrochemical ELISA simulation (Task 2)
# Companion document: docs/02_hardware_automation.md (source keys resolve in its §9 reference list)
#
# Conventions
#   - value = best estimate; low/high = plausible bounds (not statistical intervals).
#   - Units stated on every entry. Volumes in uL (microlitre), flows in uL/min, pressures in psi or MPa as
#     noted, currents in A, times in min or s as noted.
#   - source = reference key (docs/02 §9), "derived: ..." (formula in note), or UNVERIFIED.
#   - confidence: high (read from vendor document this session), medium (search summary, previous-session
#     check not repeated, or different instrument generation), low (derived with assumptions / UNVERIFIED).
#   - The sample manager is the fixed-loop SM-FL. No flow-through-needle values are used.
#
# Created 2026-11-11 by Task 2.

meta:
  version: 1
  date: "2026-11-11"
  sample_manager_type: "SM-FL (fixed loop, 6-port injection valve)"
  system_generation: "UNKNOWN (ACQUITY UPLC / I-Class / I-Class PLUS / Premier) - see docs/02 Q1"

