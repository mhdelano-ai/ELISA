# Model assumptions and parameters added by the simulation task (Task 3)
# Companion document: docs/03_simulation_model.md (section 6 lists every entry and why it was needed).
#
# Same schema as params/chemistry.yaml and params/hardware.yaml:
#   value (best estimate), low, high (plausible bounds), unit, source, confidence, note
#   source = citation key (docs/01 or docs/02 reference lists, or the references in docs/03 section 11),
#            "derived: ...", "design choice", or UNVERIFIED (engineering estimate made in this task).
#   Keys are read by the model as  ma.<section>.<name>  (chemistry.yaml -> chem.*, hardware.yaml -> hw.*).
#
# Two special sections:
#   monte_carlo : sampling settings and the list of DESIGN VARIABLES (glob patterns) that are held fixed in
#                 Monte Carlo runs (timings, flows, volumes, reagent concentrations are choices, not
#                 uncertainties; their low/high are design ranges for the optimisation task).
#   overrides   : replacements for chem.* / hw.* entries this task questions (empty at present - the
#                 questioned values are discussed in docs/03 section 6.3 and handled by separate entries
#                 below, so the Task 1/2 values stay visible).
#
# Created 2026-11-11 by Task 3.

monte_carlo:
  log_ratio_threshold: 3.0      # high/low >= 3 and low > 0 -> log-triangular, else triangular
  default_samples: 2000
  seed: 20261111
  fixed_patterns:
    - "hw.timing.*"
    - "ma.timing.*"
    - "ma.geometry.*"
    - "ma.numerics.*"
    - "ma.statistics.*"
    - "ma.readout.*_flow"
    - "ma.delivery.sample_volume"
    - "ma.delivery.conjugate_injection_volume"
    - "ma.delivery.plug_at_outlet_end"
    - "ma.labelling.*_concentration"
    - "ma.chemistries.*.substrate_concentration"
    - "chem.antibodies.conc_*"
    - "chem.substrates.pAPP.working_concentration"
    - "chem.surfaces.bead_number_per_100uL_digital_ELISA"
    - "chem.analyte.*"
    - "hw.smfl.loop_volume_recommended"
    - "hw.smfl.loop_flush_volumes_for_transfer"
    - "hw.smfl.injection_overhead_time"
    - "hw.reactors.packed_microbed_10uL.bed_volume"
    - "hw.reactors.packed_microbed_10uL.bead_diameter"
    - "hw.reactors.monolith_cimac_100uL.bed_volume"
    - "hw.flow_cells.thin_layer_basi.channel_height"
    - "hw.flow_cells.thin_layer_basi.we_area"
    - "hw.flow_cells.ida_redox_cycling.gap"
    - "hw.flow_cells.thermo_6011rs_coulometric.min_flow"
    - "hw.flow_cells.dropsens_spe_walljet.we_diameter"
    - "hw.flow_cells.antec_sencell.we_diameter"
    - "hw.bsm.flow_min"
    - "hw.tubing.*_length"

overrides:
  # Corrections / replacements of chem.* and hw.* values (the originals stay in chemistry.yaml / hardware.yaml
  # and are reported next to the override by ParameterSet.params[key].overridden_from).
  # Added 2026-11-11 by the model audit (docs/04_model_audit.md); each entry states source and confidence.
  hw.smfl.loop_volume_recommended:
    value: 100
    low: 100
    high: 100
    unit: uL
    source: "project_brief (Installed configuration, stated by the user 2026-11-11)"
    confidence: high
    note: >
      AUDIT OVERRIDE. Installed SM-FL loop is 100 uL (hardware.yaml baseline assumed a 250 uL loop with partial-loop
      injection). Changes the loop-transfer time (3 loop volumes = 300 uL), the sample plug fraction (full loop = 1.0)
      and the dispersion of the 20 uL conjugate plug (plug fraction 0.2 instead of 0.08).
  hw.bsm.flow_min:
    value: 1
    low: 1
    high: 10
    unit: uL/min
    source: "project_brief (Installed configuration: user states the I-Class PLUS BSM flows down to 1 uL/min)"
    confidence: medium
    note: >
      AUDIT OVERRIDE. docs/02 lists 10 uL/min for I-Class from vendor documents (WAT_ICLASS_SPEC); the user's figure is
      used and must be confirmed at the bench. Used by the model only as a feasibility check on pumped flows.
  chem.antibodies.koff_capture:
    value: 1.0e-4
    low: 3.0e-6
    high: 1.9e-4
    unit: 1/s
    source: "Chang2012 (generic range, V-full); acceptance criterion docs/01 section f (t1/2 >= 1 h)"
    confidence: medium
    note: >
      AUDIT OVERRIDE of the UPPER BOUND only (chemistry.yaml: 8.3e-3 /s from Kamat2020's fast commercial anti-Fc mAb).
      docs/01 f specifies that capture reagents with t1/2 < 1 h are rejected at screening, so a reagent with
      koff > ln2/3600 = 1.9e-4 /s is not part of the design that would be built; sampling it mixed a reagent-selection
      failure into the parameter uncertainty. The unscreened range is kept as a separate scenario in
      scripts/run_baseline.py ("unscreened capture reagent").

