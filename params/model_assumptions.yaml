    source: "UNVERIFIED; qualitative support: Wahlgren1995 J Colloid Interface Sci (partial desorption of lysozyme on rinsing), Marsh2002 Colloids Surf B (buffer-elutable fraction falls with adsorption time; non-ionic surfactant displaces part), Zhang2020 J Colloid Interface Sci (mAb irreversible on siliconized surface, partly removed with Poloxamer 188)"
    confidence: low
    note: >
      Scenario S3a in docs/05: fraction of conjugate NSB removed by the post-capture washes if NSB is partly
      reversible. Those studies are at monolayer coverage on bare surfaces, not sub-monolayer pM conjugate on a
      blocked surface; 0 (irreversible, the model) is inside the range. Measured by bench experiment U1.
