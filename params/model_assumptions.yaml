  viscosity:
    value: 0.89e-3
    low: 0.85e-3
    high: 1.0e-3
    unit: Pa*s
    source: "standard value for water at 25 C (also used in docs/02 section 1.2)"
    confidence: high
    note: "Dilute aqueous buffer; upper bound covers ~20 C."
  density:
    value: 997
    low: 995
    high: 1000
    unit: kg/m^3
    source: "standard value for water at 25 C"
    confidence: high
    note: ""

delivery:
  sample_volume:
    value: 100
    low: 100
    high: 100
    unit: uL
    source: project_brief
    confidence: high
    note: "Sample budget per determination."
  adsorptive_loss_fraction_with_carrier:
    value: 0.2
    low: 0.02
    high: 0.6
    unit: fraction lost
    source: UNVERIFIED
    confidence: low
    note: >
      [UNVERIFIED] Loss of fM IgG to vial, needle, needle-to-valve path and loop WITH IgG-free carrier protein and
      low-bind vials (the design assumption). chem.analyte.adsorptive_loss_fraction_untreated_tube (0.5, 0.1-0.9)
      is the untreated case and can be selected per architecture (sample_treatment = "untreated"). Measure by
      spike-recovery through the SM-FL (docs/02 R1). Scales signal only, not the blank.
  delivered_fraction_full_loop_100:
    value: 1.0
    low: 0.97
    high: 1.0
    unit: fraction of the 100 uL injected sample
    source: "project_brief (Installed configuration: full-loop, 100 uL loop, 2x overfill); WKB2345; WAT_INJ_MODES"
    confidence: medium
    note: >
      Full-loop injection: the loop contains only sample and is injected completely, so the injected volume equals the
      loop volume (100 uL); ~200 uL is DRAWN from the vial (2x overfill). Whether the brief's <= 100 uL limit applies to
      the injected or the drawn volume is open (docs/00); variants named */PLNO75 give the drawn-volume-limited case.
      Low bound 0.97 allows for loop-volume tolerance (UNVERIFIED).
  plug_at_outlet_end:
    value: 0
    low: 0
    high: 0
    unit: boolean (1 = plug next to loop outlet)
    source: "design choice (conservative); docs/02 section 2.4c"
    confidence: low
    note: "Position of the PLNO sample/conjugate plug in the loop at inject; far end is the slower case in the Task 2 table."
  conjugate_injection_volume:
    value: 20
    low: 10
    high: 50
    unit: uL
    source: "design choice (docs/02 section 7.4)"
    confidence: medium
    note: "PLNO 20 uL from a 4 C vial."
  tubing_dilution_factor:
    value: 0.9
    low: 0.7
    high: 1.0
    unit: fraction
    source: UNVERIFIED
    confidence: low
    note: "Extra peak dilution of a reagent plug between injection valve and reactor (1.9 uL tubing, docs/02 7.5), multiplied on the loop-outlet peak computed by the loop model."

