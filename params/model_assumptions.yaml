  surface_factor_chip:
    value: 10.0
    low: 1.0
    high: 100.0
    unit: fold
    source: "UNVERIFIED (Jenkins1988, Qu1998: electrode/solid-phase NSB dominant)"
    confidence: low
    note: "Channel walls including electrode materials (Au/Pt/carbon, glass) after blocking."
  surface_factor_tubing:
    value: 3.0
    low: 1.0
    high: 30.0
    unit: fold
    source: UNVERIFIED
    confidence: low
    note: "PEEK tubing and valve passages exposed to conjugate and later to substrate."
  label_factor_igg_enzyme_conjugate:
    value: 0.04
    low: 0.01
    high: 0.15
    unit: fold
    source: "derived (audit, docs/04 section 3.1): Rissin2010 + Chang2012 (V-full, re-read in the audit); Rissin2010 85 fM plate anchor"
    confidence: low
    note: >
      NSB of an IgG-enzyme conjugate (or biotinylated IgG) per unit exposure, relative to the SbG-derived
      chem.nsb.nsb_effective_rate_constant (4e-11 m/s). Was 1.0 (0.3-3), UNVERIFIED, which is inconsistent with the
      very experiment k_nsb comes from: in Rissin2010 the beads also saw ~1 nM biotinylated detection antibody for
      45 min (67x the molar exposure of 15 pM SbG x 30 min x 1.5); with factor 1 that dAb alone, labelled at the 13 %
      efficiency Chang2012 reports, would light ~19 % of beads, against ~1 % (Rissin2010) / ~0.3 % (Chang2012) observed
      for the whole blank. Upper bounds from that experiment (all background from dAb): 0.052 (1 % active) and 0.016
      (0.3 %). Independent anchor: Rissin2010's best commercial ELISA blank, 85 fM TNF-a equivalent, needs
      k = 1.2e-12 (10 nM label) to 4.4e-12 m/s (1 nM), i.e. factor 0.029-0.11. Value 0.04 (k_eff 1.6e-12 m/s);
      bounds 0.01-0.15 span both anchors. The previous assumption (factor 1) is kept as the pessimistic
      scenario "SbG-equivalent NSB" in scripts/run_baseline.py.
  label_factor_polyhrp:
    value: 3.0
    low: 1.0
    high: 10.0
    unit: fold
    source: "UNVERIFIED (chem poly_HRP note: bigger labels -> more NSB)"
    confidence: low
    note: ""
  biotin_dab_nsb_labelling_fraction:
    value: 1.0
    low: 0.3
    high: 1.0
    unit: fraction
    source: UNVERIFIED
    confidence: low
    note: "Two-step chemistries: fraction of non-specifically bound biotinylated dAb that is reached by the SA-enzyme (adds to SA-enzyme NSB)."
  blank_igg_contamination_equivalent:
    value: 0.0
    low: 0.0
    high: 3.0e-15
    unit: M
    source: "UNVERIFIED (Parry1997: human IgG on lab equipment, qualitative)"
    confidence: low
    note: "Environmental human-IgG contamination of blank samples, as analyte concentration. Nominal 0; Monte Carlo up to 3 fM (0.45 pg/mL)."

