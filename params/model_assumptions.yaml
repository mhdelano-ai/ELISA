    high: 1.0
    unit: fold
    source: "UNVERIFIED; qualitative support: Ruan1986 Ann Clin Biochem doi:10.1177/000456328602300106 (Fab'-HRP NSB reduced with normal F(ab')2, LOD 5x lower with other changes); Hashida1985 J Immunoassay doi:10.1080/01971528508063024 (purified Fab' conjugates gave lower background)"
