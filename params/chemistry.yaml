# Chemistry / biology parameter database for the electrochemical ELISA simulation (Task 1)
# Companion document: docs/01_literature_parameters.md (source keys resolve in its reference list, section R)
#
# Conventions
#   - Each parameter is a mapping whose KEY is the parameter name, with fields:
#       value (best estimate), low, high (plausible bounds, not statistical CIs), unit, source, confidence, note
#   - SI-consistent units, stated on every entry (M = mol/L; m^2/s; 1/(M*s); V).
#   - source = citation key in the reference list, "derived: ..." (arithmetic on cited numbers, shown in note),
#     or UNVERIFIED (not checked against any source in this session).
#   - Verification tag at the start of each note:
#       [V-full] read in this session in the primary paper full text
#       [V-abs]  read in this session in the primary paper abstract / PubMed record / vendor datasheet
#       [V-sec]  read in this session via a secondary source (named in note)
#       [INHERITED] carried over from the previous (unreviewed) draft; source key plausible, NOT re-checked
#       [UNVERIFIED] engineering estimate
#   - confidence: high (primary source read, conditions match), medium (primary source, different conditions,
#     or secondary source), low (derived with assumptions, inherited unchecked, or UNVERIFIED).
#   - Potentials are vs Ag/AgCl (sat. KCl) unless the note says otherwise.
#
# Revised 2026-11-11 by Task 1 (second agent). Inherited draft kept where it held up; changes listed in
# docs/01_literature_parameters.md section h.

