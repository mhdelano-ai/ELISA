        -> ~3400 /s. Non-DEA buffers and conjugation lower it; best estimate 1500 /s. Low bound from a
        low-grade commercial CIAP measured at pH 8.2 (kcat 9.7 /s, Brooke2023) - shows enzyme-grade risk.
        MEASURE on the actual conjugate.
