# Chemistry / biology parameter database for the electrochemical ELISA simulation (Task 1)
# Companion document: docs/01_literature_parameters.md (source keys resolve in its reference list)
#
# Conventions
#   - SI units throughout (m, s, mol, M = mol/L where stated, V, m^2/s). Units are stated on every entry.
#   - value = best estimate for simulation; low/high = plausible bounds (not statistical CIs).
#   - source = citation key in the reference list, "derived:" (arithmetic on cited numbers, shown in note),
#     or UNVERIFIED (not checked against a source in this session -> do not treat as literature fact).
#   - confidence: high (directly read from primary source, conditions match), medium (primary source but
#     different conditions/system, or secondary source), low (derived with assumptions, or UNVERIFIED).
#   - Potentials are vs Ag/AgCl (sat. KCl) unless the note says otherwise.
#
# Created 2026-11-11 by Task 1. Do not edit numbers without updating the source key.

meta:
  version: 1
  date: "2026-11-11"
  potential_reference: "Ag/AgCl (saturated KCl) unless noted"
  temperature_default_K: 296

analyte:
  molar_mass:
    value: 150000
    low: 145000
    high: 155000
    unit: g/mol
    source: project_brief
    confidence: high
    note: "Human IgG ~150 kDa as given in the project brief."
  target_concentration_mass:
    value: 1.0e-12
    low: 1.0e-12
    high: 1.0e-12
    unit: g/mL
    source: project_brief
    confidence: high
    note: "LOD target 1 pg/mL."
  target_concentration_molar:
    value: 6.67e-15
    low: 6.4e-15
    high: 6.9e-15
    unit: M
    source: "derived: 1e-12 g/mL / 150000 g/mol * 1000 mL/L"
    confidence: high
    note: "6.7 fM. 100 uL sample contains 4.0e5 molecules (0.67 amol)."
  diffusion_coefficient:
    value: 3.89e-11
    low: 3.5e-11
    high: 4.5e-11
    unit: m^2/s
    source: Chang2012
    confidence: high
    note: "IgG D = 3.89e-7 cm^2/s quoted in Chang2012 (25 C approx.)."
  adsorptive_loss_fraction_untreated_tube:
    value: 0.5
    low: 0.1
    high: 0.9
    unit: fraction
    source: "Zhang2023microtube; Dixit2011"
    confidence: low
    note: >
      Protein recovery from different microtubes ranged <10% to >90% (Zhang2023microtube, proteome-scale,
      not IgG-specific). At fM concentrations loss to vials, needle, loop and tubing is potentially dominant.
      Model as unknown; mitigate with carrier protein (IgG-free BSA) / low-binding plastics. Must be measured.

antibodies:
  kon_capture:
    value: 3.0e5
    low: 9.0e4
    high: 1.2e6
    unit: 1/(M*s)
    source: Chang2012
    confidence: medium
    note: >
      Range measured (BLI) for 5 ELISA-grade antibodies (PSA, tau, TNF-a): kon 9e4-1.2e6 /M/s.
      PSA capture mAb 2.7e5. No anti-human-IgG-specific kinetics were verified in this session;
      generic ELISA-grade range used. Chang2012 shows capture yield is mainly on-rate limited.
  koff_capture:
    value: 1.0e-4
    low: 3.0e-6
    high: 1.3e-3
    unit: 1/s
    source: Chang2012
    confidence: medium
    note: "Range for 5 antibodies (BLI); PSA capture mAb 3e-6 /s. Surface rebinding/avidity lowers effective koff on dense surfaces (Chang2012, qualitative)."
  KD_capture:
    value: 3.0e-10
    low: 1.2e-11
    high: 1.0e-9
    unit: M
    source: Chang2012
    confidence: medium
    note: "KD 12 pM - 1 nM across 5 ELISA antibodies."
  kon_detection:
    value: 3.9e5
    low: 9.0e4
    high: 1.2e6
    unit: 1/(M*s)
    source: Chang2012
    confidence: medium
    note: "Example detection antibody: kon 3.9e5 /M/s, koff 8.6e-4 /s, KD 2 nM."
  koff_detection:
    value: 8.6e-4
    low: 3.0e-6
    high: 1.3e-3
    unit: 1/s
    source: Chang2012
    confidence: medium
    note: "Dissociation of detection Ab during washes/substrate step is a signal-loss term (Chang2012)."
  conc_detection_antibody_typical:
    value: 1.0e-9
    low: 1.0e-10
    high: 1.0e-8
    unit: M
    source: "Chang2012; Rissin2010"
    confidence: high
    note: "~0.1-0.15 ug/mL used in digital ELISA to limit NSB; higher conc. raises background."
  conc_streptavidin_enzyme_typical:
    value: 1.0e-11
    low: 1.0e-12
    high: 5.0e-11
    unit: M
    source: Rissin2010
    confidence: high
    note: "SbG used at 1-50 pM in digital ELISA labeling step (30 min)."
  streptavidin_biotin_koff:
    value: 5.1e-9
    low: 1.0e-9
    high: 1.0e-8
    unit: 1/s
    source: Chang2012
    confidence: medium
    note: "Quoted koff for streptavidin-biotin; effectively irreversible on assay time scale."
  protein_G_B1_KD_human_IgG_pH7_4:
    value: 4.9e-7
    low: 1.0e-8
    high: 5.0e-7
    unit: M
    source: Watanabe2009
    confidence: medium
    note: >
      Single B1 domain of protein G vs human IgG by SPR, pH 7.4: KD 4.9e-7 M. Full multi-domain protein G
      binds with higher apparent affinity (avidity) - low bound is an UNVERIFIED allowance for that.
  protein_G_elution_pH:
    value: 3.1
    low: 2.5
    high: 3.5
    unit: pH
    source: Watanabe2009
    confidence: medium
    note: "Peak elution of human IgG from wild-type GB1 column in decreasing pH gradient."
  enzyme_to_antibody_ratio_HRP:
    value: 3
    low: 1
    high: 4
    unit: mol/mol
    source: "ThermoPolyHRP21140; OriGeneHRPkit"
    confidence: low
    note: >
      Thermo states standard conjugates are limited to 1-3 HRP per protein; commercial conjugation kits
      recommend 4:1 HRP:IgG in the reaction (not the final product ratio). Vendor-specific; measure.
  enzyme_to_antibody_ratio_ALP:
    value: 1
    low: 0.5
    high: 2
    unit: mol/mol
    source: UNVERIFIED
    confidence: low
    note: "Typical 1:1 ALP(140 kDa):IgG conjugates assumed; not verified in this session."
  poly_HRP_per_streptavidin_polymer:
    value: 20
    low: 10
    high: 400
    unit: HRP per conjugate
    source: "SigmaS9420; Malhotra2010; Mani2009"
    confidence: medium
    note: >
      Sigma S9420 SA-peroxidase polymer: ~20 HRP per polymer, >=10x sensitivity vs plain SA-HRP.
      Research-grade multilabels go much higher: SA-HRP gave 14-16 labels/antigen, CNT-HRP 106 HRP per
      100 nm (Malhotra2010), 1 um bead-HRP 7500 HRP (Mani2009) - those carry higher NSB/steric risk.
  diffusion_coefficient_IgG_ALP_conjugate:
    value: 3.1e-11
    low: 2.5e-11
    high: 3.6e-11
    unit: m^2/s
    source: "derived: Chang2012 IgG D scaled by (150/290)^(1/3) for ~290 kDa"
    confidence: low
    note: "Stokes-Einstein mass scaling, globular assumption. Measure by DLS if critical."
  diffusion_coefficient_SbG_conjugate:
    value: 2.7e-11
    low: 2.0e-11
    high: 3.0e-11
    unit: m^2/s
    source: Chang2012
    confidence: medium
    note: "Chang2012 assumes SbG ~ beta-galactosidase D = 2.7e-7 cm^2/s."
  diffusion_coefficient_SA_polyHRP:
    value: 2.0e-11
    low: 1.0e-11
    high: 3.0e-11
    unit: m^2/s
    source: "derived: mass scaling ~1 MDa from SigmaS9420 composition"
    confidence: low
    note: "Assumes ~20 x 44 kDa HRP + SA; polymer shape unknown."

